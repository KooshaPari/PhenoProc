[package]
name = "phenotype-core-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Phenotype Contributors"]
license = "MIT OR Apache-2.0"
description = "WASM bindings for phenotype-core (TypeScript/JavaScript)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phenotype-core = { path = "../phenotype-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[profile.release]
opt-level = 3
lto = true

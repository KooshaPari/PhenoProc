[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno-llm"
version = "0.1.0"
description = "LLM routing and ensemble strategies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Phenotype Contributors"}]
dependencies = [
    "pydantic>=2.5.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0", "mypy>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_llm"]

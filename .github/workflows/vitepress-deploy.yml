name: VitePress Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
        with:
          node-version: '20'
      - uses: actions/configure-pages@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      - name: Install dependencies
        run: |
          if [ -f docs/package.json ]; then npm ci;
          else npm install -g vitepress; fi
      - name: Build VitePress site
        run: |
          if [ -f docs/package.json ]; then npm run docs:build;
          else npx vitepress build docs; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v5
        with:
          path: docs/.vitepress/dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@4a352b5f17c6ff6b381c1a3abcc8b016e8a1c5c2  # v4

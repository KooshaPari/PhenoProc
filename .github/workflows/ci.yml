name: CI

# Default: read-only token for all jobs (DAG L2-35 hardening).
# Override to `contents: write` per-job only for release/publish flows.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Rust CI
    uses: KooshaPari/template-commons/.github/workflows/reusable-rust-ci.yml@main
    with:
      rust-version: stable
      enable-coverage: true

  security:
    name: Security Audit
    uses: KooshaPari/template-commons/.github/workflows/reusable-security-scan.yml@main
    with:
      language: rust
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  phenotype-validate:
    name: Governance Validation
    uses: KooshaPari/phenotypeActions/.github/workflows/validate-governance.yml@main


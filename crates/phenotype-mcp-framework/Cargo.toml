[package]
name = "phenotype-mcp-framework"
version = "0.2.0"
edition = "2021"
description = "MCP server framework with shared protocol types and JSON-RPC handling"
authors = ["Phenotype Developers <dev@phenotype.dev>"]
license = "MIT"
repository = "https://github.com/phenotype-org/phenotype"
rust-version = "1.75"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

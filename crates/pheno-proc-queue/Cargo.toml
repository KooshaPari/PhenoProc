[package]
name = "pheno-proc-queue"
version = "0.1.0"
edition = "2021"
description = "Priority task queue for PhenoProc"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoProc"
documentation = "https://docs.rs/pheno-proc-queue"
keywords = ["phenotype", "pheno-proc"]
categories = ["development-tools"]
authors = ["kooshapari"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[lib]
name = "pheno_proc_queue"
path = "src/lib.rs"

[package]
name = "agileplus-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoProc"
description = "agileplus telemetry — Phenotype infrastructure crate (PhenoProc)"
documentation = "https://docs.rs/agileplus-telemetry"
keywords = ["phenotype", "pheno-proc", "telemetry"]
categories = ["development-tools::profiling"]
authors = ["kooshapari"]

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
tokio .workspace = true
tracing .workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { version = "0.13" }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9"
chrono .workspace = true
thiserror .workspace = true
dirs = "5"
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-test = "0.2"
tempfile = "3"

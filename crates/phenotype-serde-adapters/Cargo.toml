[package]
name = "phenotype-serde-adapters"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Labs <dev@phenotype.io>"]
description = "Serialization adapters for encrypted fields, versioning, and custom formats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype-labs/phenotype"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_json_lenient = "0.2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"

# Optional features
[features]
default = []
encrypted = ["aes-gcm", "rand"]
messagepack = ["rmp-serde"]

[dependencies.aes-gcm]
version = "0.10"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.rmp-serde]
version = "1.3"
optional = true

[dev-dependencies]
tokio-test = "0.4"
serde_test = "1.0"

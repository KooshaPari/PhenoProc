[package]
name = "phenotype-validation"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Validation utilities for Phenotype data"
repository = "https://github.com/KooshaPari/PhenoProc"
documentation = "https://docs.rs/phenotype-validation"
keywords = ["phenotype", "pheno-proc", "validation"]
categories = ["data-structures"]
authors = ["kooshapari"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
once_cell = "1"

[dev-dependencies]
phenotype-test-fixtures = { path = "../phenotype-test-fixtures" }

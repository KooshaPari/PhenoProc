[package]
name = "phenotype-port-traits"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Port traits for Phenotype hexagonal architecture"
repository = "https://github.com/KooshaPari/PhenoProc"
authors = ["kooshapari"]
documentation = "https://docs.rs/phenotype-port-traits"
keywords = ["phenotype", "pheno-proc", "traits"]
categories = ["rust-patterns", "development-tools"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

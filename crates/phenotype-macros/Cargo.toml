[package]
name = "phenotype-macros"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Procedural macros for Phenotype"
repository = "https://github.com/KooshaPari/PhenoProc"
documentation = "https://docs.rs/phenotype-macros"
keywords = ["phenotype", "pheno-proc", "macros"]
categories = ["development-tools::procedural-macro-helpers"]
authors = ["kooshapari"]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]

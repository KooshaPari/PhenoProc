[package]
name = "pheno-proc-core"
version = "0.1.0"
edition = "2021"
description = "Process management primitives for PhenoProc registry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoProc"
documentation = "https://docs.rs/pheno-proc-core"
keywords = ["phenotype", "pheno-proc", "core"]
categories = ["data-structures"]
authors = ["kooshapari"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.38"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "pheno_proc_core"
path = "src/lib.rs"

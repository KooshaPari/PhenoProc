[package]
name = "phenotype-test-infra"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Test infrastructure for Phenotype"
repository = "https://github.com/KooshaPari/PhenoProc"
documentation = "https://docs.rs/phenotype-test-infra"
keywords = ["phenotype", "pheno-proc", "test"]
categories = ["development-tools::testing", "development-tools"]
authors = ["kooshapari"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
tokio-test = { workspace = true }

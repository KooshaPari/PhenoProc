[package]
name = "phenotype-project-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Project discovery and metadata management for the monorepo"

[features]
default = ["async-discovery", "cache", "health-integration"]
async-discovery = []
cache = ["dep:dashmap"]
health-integration = ["dep:phenotype-health", "dep:reqwest"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Optional dependencies
phenotype-health = { path = "../phenotype-health", optional = true }
dashmap = { version = "6", optional = true }
reqwest = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

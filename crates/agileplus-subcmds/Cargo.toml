[package]
name = "agileplus-subcmds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoProc"
authors = ["kooshapari"]
description = "agileplus subcmds — Phenotype infrastructure crate (PhenoProc)"
documentation = "https://docs.rs/agileplus-subcmds"
keywords = ["phenotype", "pheno-proc"]
categories = ["development-tools"]

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
agileplus-triage = { path = "../agileplus-triage" }
agileplus-p2p = { path = "../agileplus-p2p" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
